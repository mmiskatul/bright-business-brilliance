<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Solid Black Rounded Square -->
  <rect width="64" height="64" rx="10" fill="#000000" />
  
  <!-- Soccer Ball Outer Ring -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#FFFFFF" stroke-width="3.2" />

  <!-- Central Pentagon -->
  <polygon
    points="32,22.4 39.6,28 36.6,37 27.4,37 24.4,28"
    fill="#FFFFFF"
    stroke="#FFFFFF"
    stroke-width="1.6"
    stroke-linejoin="round"
  />

  <!-- Radiating Seams to Outer Perimeter -->
  <!-- Top -->
  <line x1="32" y1="22.4" x2="32" y2="13.2" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <!-- Top-Right -->
  <line x1="39.6" y1="28" x2="48.8" y2="23.6" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <!-- Bottom-Right -->
  <line x1="36.6" y1="37" x2="44.4" y2="46.4" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <!-- Bottom-Left -->
  <line x1="27.4" y1="37" x2="19.6" y2="46.4" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <!-- Top-Left -->
  <line x1="24.4" y1="28" x2="15.2" y2="23.6" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
</svg>
